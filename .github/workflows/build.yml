name: Bygg APK

on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test core
        run: ./gradlew --no-daemon :core:test

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk leapy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: leapy-apk
          path: leapy.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAG="v0.1.${{ github.run_number }}"
            gh release create "$TAG" leapy.apk --title "Leapy $TAG" --notes "Installer leapy.apk på Android-telefonen."
          else
            # Test builds are pre-releases, so "latest" keeps pointing at the last real version.
            TAG="test-${{ github.run_number }}"
            gh release create "$TAG" leapy.apk --prerelease --target "${{ github.sha }}" --title "Leapy testversjon $TAG" --notes "Testversjon. Installer leapy.apk på Android-telefonen."
          fi
